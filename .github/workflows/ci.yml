name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: t
          POSTGRES_PASSWORD: t
          POSTGRES_DB: t
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U t" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      MONITOR_NOTIFY_TEST_DATABASE_URL: postgresql://t:t@localhost:5432/t
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -p no:warnings --cov=monitor_notify --cov-report=term-missing --cov-fail-under=80
      # Yasaklı adlar repoda değil, secret'ta durur (secret değerleri loglarda maskelenir).
      - name: Retailer adı denetimi
        env:
          FORBIDDEN_NAMES: ${{ secrets.FORBIDDEN_NAMES }}
        run: |
          if [ -z "$FORBIDDEN_NAMES" ]; then
            echo "FORBIDDEN_NAMES tanımlı değil; denetim atlandı."
            exit 0
          fi
          if grep -rliE "$FORBIDDEN_NAMES" src tests; then
            echo "Public repoda retailer adı geçmemeli." && exit 1
          fi
      - name: Wheel migration dosyalarını içeriyor
        run: |
          python -m build --wheel
          unzip -l dist/*.whl | grep "monitor_notify/store/migrations/001_rules_targets.sql"
