[project]
name = "monitor-notify"
version = "0.2.0"
description = "Stok ve fiyat takip botları için paylaşılan Telegram bildirim katmanı"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.29",
    "python-telegram-bot>=21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "build>=1.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Migration'lar Python modülü olmadığı için açıkça eklenmeli; yoksa
# `pip install .` ile kurulan imajda klasör boş kalır.
[tool.setuptools.package-data]
"monitor_notify.store" = ["migrations/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

# Kural seti sabit: ruff sürümü yükseldikçe varsayılanlar değişiyor, CI ile
# yerel sonuç aynı kalmalı.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
source = ["src/monitor_notify"]
